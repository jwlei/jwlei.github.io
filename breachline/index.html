<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020604" />
    <meta name="description" content="Breachline: type the perfect movie hack at your own pace, press Enter, and watch every phase play out on the other half of the screen." />
    <title>Breachline · jleiros.com</title>
    <link rel="icon" type="image/svg+xml" href="/media/images/icons/favicon.svg" />
    <link rel="stylesheet" href="breachline.css" />
</head>
<body>
    <div class="app" id="app">
        <section class="pane code-pane" id="code-pane" aria-label="Your terminal">
            <header class="bar">
                <a class="back" href="/#garden-section">← jleiros.com</a>
                <span class="tab">breach.ghost</span>
                <span class="spacer"></span>
                <label class="cpk">Chars/key
                    <select id="cpk">
                        <option>3</option>
                        <option selected>5</option>
                        <option>8</option>
                        <option>13</option>
                    </select>
                </label>
                <button type="button" class="btn" id="btn-kbd">Keyboard</button>
            </header>
            <div class="code-scroll" id="code-scroll"><div class="code" id="code"></div></div>
            <div class="hint" id="hint">
                <b>Start typing. Anything.</b>
                <span>Any key writes the code for you. When a phase is written, press Enter to run it and watch it happen on the other screen.</span>
                <small class="touch-only">Tap here to type, or open the keyboard.</small>
            </div>
            <button type="button" class="run-hint" id="run-hint" hidden></button>
            <textarea id="sink" class="sink" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type here"></textarea>
        </section>

        <section class="pane ops-pane" aria-label="Operation view">
            <header class="bar ops-bar">
                <div class="stat target"><span>TARGET</span><b id="t-name">—</b><small id="t-host"></small></div>
                <div class="stat"><span>STATUS</span><b id="status" class="st-typing">TYPING</b></div>
                <div class="stat kps"><span>KEYS/S</span><b id="kps">0</b></div>
                <span class="spacer"></span>
                <button type="button" class="btn" id="btn-full">Fullscreen</button>
            </header>
            <div class="stage-line">
                <span id="stage-num">STAGE 1/10</span>
                <b id="stage-name">RECON</b>
                <span id="stage-title" class="stage-title"></span>
                <span class="spacer"></span>
                <span id="stage-pct">0%</span>
            </div>
            <div class="viewport" id="viewport"><canvas id="ops"></canvas></div>
            <footer class="ops-foot">
                <ol class="checklist" id="checklist"></ol>
                <ol class="feed" id="feed"></ol>
            </footer>
        </section>
    </div>

    <div class="overlay" id="overlay" hidden>
        <div class="ov-box" id="ov-box">
            <h1 id="ov-title"></h1>
            <p id="ov-text"></p>
            <button type="button" class="btn primary" id="ov-btn"></button>
        </div>
    </div>

    <script src="breachline.js"></script>
</body>
</html>
